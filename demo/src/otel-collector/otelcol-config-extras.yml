# Sherlog: send everything the collector receives to Elasticsearch, in addition to the
# debug output. The collector REPLACES lists instead of adding to them, so the names that
# were already there (debug, span_metrics) are repeated.
exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200   # "elasticsearch" is the container's name on the Docker network
    sending_queue:
      batch:
      # The exporter waits up to 10 s to fill a batch, and the shop's OpenTelemetry libraries
      # give up after 10 s, so most data was dropped ("context canceled"). Flushing every 1 s
      # keeps the wait well below that limit.
        flush_timeout: 1s

service:
  pipelines:
    traces:
      exporters: [debug, span_metrics, elasticsearch]
    metrics:
      exporters: [debug, elasticsearch]
    logs:
      exporters: [debug, elasticsearch]