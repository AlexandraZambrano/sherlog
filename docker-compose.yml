# The OpenTelemetry Demo (core layer), copied into demo/. Its variables come from its
# own .env, then .env.override, which wins because it is listed last.
include:
  - path: demo/compose.yaml
    project_directory: demo
    env_file:
      - demo/.env
      - demo/.env.override
# Local Elasticsearch and Kibana for development. Start with: docker compose up -d
services:
  # Stand-in for the demo's AI shop assistant. The demo's load generator calls
  # http://agent:8010/prompt, but we do not run the demo's assistant layer, so those calls
  # failed with a DNS error (about 6.5% of all requests). This tiny server answers 200 to
  # everything. It is a stub, not a real assistant. See demo/README.md.
  agent:
    image: hashicorp/http-echo:1.0.0   # pinned, supports arm64
    command: ["-listen=:8010", "-text=ok"]
    mem_limit: 16m
  elasticsearch:
    # The version comes from .env; the :? makes compose stop with a message if it is missing.
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:?Set ELASTIC_VERSION in .env}
    environment:
      - discovery.type=single-node        # one node, no cluster to form
      - xpack.security.enabled=false      # no passwords: fine for local development only
      - ES_JAVA_OPTS=-Xms1g -Xmx1g        # Java memory: half of the container limit
    mem_limit: 2g                         # the 2 GB cap from the README
    ports:
      - "127.0.0.1:9200:9200"             # only reachable from this computer, not from the network
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1 "]                           # a command that succeeds when Elasticsearch answers
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:?Set ELASTIC_VERSION in .env}
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200   # containers reach each other by service name
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy        # wait until the healthcheck passes

volumes:
  es-data: