# Issue form for a bug report: something that does not work as expected.
name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, Docker version, and which LLM you used (Groq or Ollama).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any error output. Remove API keys first.
      render: shell
